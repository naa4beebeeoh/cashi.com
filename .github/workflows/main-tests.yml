name: Main branch tests

# Full backend suite (unit + integration) and frontend Jest on every push to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Start Postgres + Redis
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --wait
          docker compose ps

      - name: Run all backend tests
        id: test
        env:
          RUN_INTEGRATION: "1"
          DATABASE_URL: postgres://cashi:cashi@localhost:5432/cashi?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          mkdir -p reports
          # Same package set as unit CI; RUN_INTEGRATION=1 un-skips cashback integration
          # (domain/config/httpapi have no integration gate — they always run).
          go run gotest.tools/gotestsum@v1.12.3 \
            --junitfile reports/junit.xml \
            --jsonfile reports/test.json \
            --format standard-verbose \
            -- -count=1 -covermode=atomic -coverprofile=reports/coverage.out \
            ./internal/domain/... \
            ./internal/config/... \
            ./internal/httpapi/... \
            ./internal/cashback/...

      - name: Generate coverage HTML
        if: always()
        run: |
          if [[ -f reports/coverage.out ]]; then
            go tool cover -html=reports/coverage.out -o reports/coverage.html
            go tool cover -func=reports/coverage.out | tee reports/coverage.txt
          fi

      - name: Write job summary
        if: always()
        run: |
          TOTAL="n/a"
          if [[ -f reports/coverage.out ]]; then
            TOTAL=$(go tool cover -func=reports/coverage.out | awk '/total:/ {print $3}')
          fi

          {
            echo "## Backend (unit + integration)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Result | ${{ steps.test.outcome }} |"
            echo "| Statement coverage | **${TOTAL}** |"
            echo "| \`RUN_INTEGRATION\` | \`1\` (Compose Postgres + Redis) |"
            echo ""
            echo "### Packages under test"
            echo ""
            echo "\`./internal/domain/...\` · \`./internal/config/...\` · \`./internal/httpapi/...\` · \`./internal/cashback/...\`"
            echo ""
            echo "### Testing strategy"
            echo ""
            echo "Full pyramid on main: pure policy + HTTP contracts + real Postgres/Redis races (integration un-skipped)."
            echo ""
            echo "| Layer | What runs here |"
            echo "|-------|----------------|"
            echo "| Domain | \`CashbackForPayment\`, \`ComputeAward\` (min / 5% floor / daily & budget clamps) |"
            echo "| Config | staging/production fail-closed; dotenv does not override process env |"
            echo "| HTTP | httptest + stubs: status mapping, CORS, \`/readyz\` |"
            echo "| Service (unit) | Pay/Redeem validation; Asia/Jakarta day boundary |"
            echo "| Integration | \`TestPayRulesAndIdempotency\`, concurrent idempotent pay, daily-cap clamp, campaign budget overspend |"
            echo ""
            echo "### Integration infra"
            echo ""
            echo "- Compose services: Postgres 16 + Redis 7 (migrations applied on first boot)"
            echo "- Env: \`DATABASE_URL\`, \`REDIS_URL\` (demo defaults); cashback integration skips without \`RUN_INTEGRATION=1\`"
            echo ""
            if [[ -f reports/coverage.txt ]]; then
              echo "### Coverage by function"
              echo ""
              echo '```'
              cat reports/coverage.txt
              echo '```'
              echo ""
            fi
            echo "### Artifacts attached to this run"
            echo ""
            echo "- \`coverage.html\` — **Go native HTML coverage** (\`go tool cover -html\`)"
            echo "- \`junit.xml\` — JUnit report (QA / CI tooling)"
            echo "- \`test.json\` — \`go test -json\` stream via gotestsum"
            echo "- \`coverage.out\` / \`coverage.txt\` — raw coverage data"
            echo ""
            echo "> Go does not ship an HTML *test* report like Jest; coverage HTML + JUnit is the usual pair."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-main-test-reports-${{ github.run_number }}
          path: |
            backend/reports/coverage.html
            backend/reports/coverage.out
            backend/reports/coverage.txt
            backend/reports/junit.xml
            backend/reports/test.json
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        id: test
        run: |
          mkdir -p reports
          npx jest --watch=false --ci \
            --json --outputFile=reports/jest.json \
            2>&1 | tee reports/jest.log

      - name: Write job summary
        if: always()
        run: |
          SUITES="n/a"
          TESTS="n/a"
          PASSED="n/a"
          FAILED="n/a"
          DURATION="n/a"
          if [[ -f reports/jest.json ]]; then
            SUITES=$(node -e "const j=require('./reports/jest.json'); console.log(j.numTotalTestSuites)")
            TESTS=$(node -e "const j=require('./reports/jest.json'); console.log(j.numTotalTests)")
            PASSED=$(node -e "const j=require('./reports/jest.json'); console.log(j.numPassedTests)")
            FAILED=$(node -e "const j=require('./reports/jest.json'); console.log(j.numFailedTests)")
            DURATION=$(node -e "const j=require('./reports/jest.json'); console.log((j.testResults||[]).reduce((s,r)=>s+(r.endTime-r.startTime),0)/1000+'s')")
          fi

          {
            echo "## Frontend Jest"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Result | ${{ steps.test.outcome }} |"
            echo "| Suites | ${SUITES} |"
            echo "| Tests | **${PASSED}** passed / ${FAILED} failed / ${TESTS} total |"
            echo "| Duration | ${DURATION} |"
            echo ""
            echo "### What we assert"
            echo ""
            echo "RNTL + \`jest-expo\` against the customer surface (API mocked — Pay/Redeem orchestration stays on the backend)."
            echo ""
            echo "| Focus | Details |"
            echo "|-------|---------|"
            echo "| Customer copy | Spotify gift card flow; campaign/budget internals stay behind Dev |"
            echo "| Happy path | Pay → cashback reward → Redeem (mocked \`../api\`) |"
            echo "| Dev drawer | Interview/ops helpers are not on the main path until Dev opens |"
            echo ""
            echo "### Command"
            echo ""
            echo '```'
            echo "npx jest --watch=false --ci"
            echo '```'
            echo ""
            if [[ -f reports/jest.json ]]; then
              echo "### Suites"
              echo ""
              node -e '
                const j = require("./reports/jest.json");
                for (const r of j.testResults || []) {
                  const name = r.name.replace(process.cwd() + "/", "");
                  const status = r.status === "passed" ? "PASS" : "FAIL";
                  console.log(`- \`${name}\` — **${status}** (${(r.assertionResults||[]).length} tests)`);
                  for (const a of r.assertionResults || []) {
                    const mark = a.status === "passed" ? "✓" : "✗";
                    console.log(`  - ${mark} ${a.title}`);
                  }
                }
              '
              echo ""
            fi
            echo "### Artifacts"
            echo ""
            echo "- \`jest.json\` — Jest JSON results"
            echo "- \`jest.log\` — full console output"
            echo ""
            echo "> Device E2E (Maestro) is local/manual — not part of this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Jest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-jest-reports-${{ github.run_number }}
          path: |
            frontend/reports/jest.json
            frontend/reports/jest.log
          if-no-files-found: warn
          retention-days: 30
